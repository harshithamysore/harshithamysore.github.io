        width: 60%;
        margin: 80px auto;
        border: none;

    }
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            padding: 40px;

        .gallery-item {

        }

        .gallery-item img {
            width: 100%;
            height: auto;
            border-radius: 0; /* remove borders completely */
            box-shadow: none; /* remove box shadow */

        .description {
            margin-top: 10px;
            font-size: 0.9rem;
            color:white;
        }
    </style>
</head>
