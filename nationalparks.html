
<!DOCTYPE HTML>
<html>
<head>
    <title>National Parks</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <style>
    .park-section {
        padding: 60px 40px;
    }

    .park-title {
        text-align: center;
        font-size: 1.6rem;
        letter-spacing: 0.05em;
        margin-bottom: 30px;
        color: white;
    }

    .divider {
        width: 60%;
        margin: 80px auto;
        border: none;
        border-top: 1px solid rgba(255, 255, 255, 0.3);
    }
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            padding: 40px;
        }

        .gallery-item {
            text-align: center;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            border-radius: 0; /* remove borders completely */
            box-shadow: none; /* remove box shadow */
        }

        .description {
            margin-top: 10px;
            font-size: 0.9rem;
            color:white;
        }
    </style>
</head>

<body>
    <header id="header">
        <h1>National parks</h1>
    </header>

<!-- ================== PARK 1 ================== -->
<section class="park-section">

    <h2 class="park-title">Parque Nacional Radal Siete Tazas, January 2026.
</h2>

    <div class="gallery-container">
        <div class="gallery-item">
            <img src="nparks/7cups.jpg" alt="Siete Tazas">
            <div class="description">Siete Tazas</div>
        </div>

        <div class="gallery-item">
            <img src="nparks/waterfall.jpg" alt="Salto de la Leona">
            <div class="description">Salto de la Leona</div>
        </div>

        <div class="gallery-item">
            <img src="nparks/bride.jpg" alt="El Velo de Novia">
            <div class="description">El Velo de Novia</div>
        </div>
    </div>

</section>

<hr class="divider">



</body>
</html>
